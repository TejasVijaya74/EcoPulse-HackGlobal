services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecopulse
      POSTGRES_USER: ecopulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecopulse -d ecopulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://ecopulse:${POSTGRES_PASSWORD}@db:5432/ecopulse
      RANDOM_SEED: ${RANDOM_SEED:-42}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-}
      WEATHER_TIMEZONE: ${WEATHER_TIMEZONE:-Asia/Kolkata}
      WEATHERAPI_KEY: ${WEATHERAPI_KEY:-}
      WEATHERAPI_BASE_URL: ${WEATHERAPI_BASE_URL:-https://api.weatherapi.com/v1}
      WEATHERAPI_DEFAULT_LOCATION: ${WEATHERAPI_DEFAULT_LOCATION:-New Delhi}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GRID_EMISSIONS_FACTOR_KG_CO2_PER_KWH: ${GRID_EMISSIONS_FACTOR_KG_CO2_PER_KWH:-0.716}
      GRID_EMISSIONS_FACTOR_SOURCE: ${GRID_EMISSIONS_FACTOR_SOURCE:-Central Electricity Authority}
      GRID_EMISSIONS_REPORTING_YEAR: ${GRID_EMISSIONS_REPORTING_YEAR:-2022-23}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_API_BASE_URL: ${GROQ_API_BASE_URL:-https://api.groq.com/openai/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    volumes:
      - model_data:/app/backend/app/ml/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  model_data:
