services:
  - type: web
    name: ecopulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: ecopulse-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://ecopulse-frontend-p55z.onrender.com
      - key: WEATHER_LATITUDE
        value: ""
      - key: WEATHER_LONGITUDE
        value: ""
      - key: WEATHER_TIMEZONE
        value: UTC

  - type: web
    name: ecopulse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ecopulse-api-5occ.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://ecopulse-api-5occ.onrender.com/ws/grid-telemetry
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ecopulse-db
    databaseName: ecopulse
    user: ecopulse
    plan: free
    postgresMajorVersion: "16"
