services:
  - type: web
    name: ecopulse-preview-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: ecopulse-preview-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://ecopulse-preview-frontend.onrender.com
      - key: WEATHER_LATITUDE
        value: ""
      - key: WEATHER_LONGITUDE
        value: ""
      - key: WEATHER_TIMEZONE
        value: UTC
      - key: API_ACCESS_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: WEATHERAPI_KEY
        sync: false

  - type: web
    name: ecopulse-preview-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ecopulse-preview-api.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://ecopulse-preview-api.onrender.com/ws/grid-telemetry
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ecopulse-preview-db
    databaseName: ecopulse_preview
    user: ecopulse_preview
    plan: free
    postgresMajorVersion: "16"
